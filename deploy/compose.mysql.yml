services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wa_commerce
      MYSQL_USER: wa_app
      MYSQL_PASSWORD: ${WA_DB_PASSWORD:?Set WA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${WA_DB_ROOT_PASSWORD:?Set WA_DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - wa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  wa_mysql:
